## IDF Component Manager Manifest File
##
## Color Detector main application component
##

dependencies:
  # ESP-IDF components
  idf:
    version: ">=5.5.2"
  
  # picotts - Text-to-Speech library
  # Source: https://github.com/lllucius/picotts
  # Note: Add picotts as a git submodule or copy to components directory:
  #   git submodule add https://github.com/lllucius/picotts components/picotts
  #
  # Uncomment below when picotts is added as a component:
  picotts:
    path: "../components/picotts"
